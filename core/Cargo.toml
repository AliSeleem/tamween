[package]
name = "tamween-core"
version = "0.1.0"
edition = "2021"
description = "Tamween shop logic: database, ledger, POS, receipts, inventory, Excel import"
publish = false

[dependencies]
calamine = "0.36.1"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"
